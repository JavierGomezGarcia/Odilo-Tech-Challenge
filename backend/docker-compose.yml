services:
  postgres:
    image: postgres:16-alpine
    container_name: odilo-tech-challenge-postgres
    environment:
      POSTGRES_DB: odilo_tech_challenge
      POSTGRES_USER: odilo
      POSTGRES_PASSWORD: odilo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odilo -d odilo_tech_challenge"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
